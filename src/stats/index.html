<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>mimi.ganba.re – Stats</title>
        <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
        <script>
            (function () {
                var p =
                    new URLSearchParams(location.search).get("uid") ||
                    localStorage.getItem("uid");
                if (!p) document.documentElement.classList.add("no-uid");
            })();
        </script>
        <link rel="stylesheet" href="stats.css" />
    </head>

    <body>
        <header id="hdr">
            <a class="back" href="../">← back</a>
            <h1>STATS</h1>
        </header>

        <div id="msg"></div>

        <main id="dash">
            <section id="overview" class="card span2">
                <div class="stats">
                    <div class="stat">
                        <div class="n" data-stat="events">0</div>
                        <div class="l">total events</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="users">0</div>
                        <div class="l">unique visitors</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="answers">0</div>
                        <div class="l">answers</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="accuracy">0%</div>
                        <div class="l">accuracy</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="relisten">0</div>
                        <div class="l">re-listens</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="active7">0</div>
                        <div class="l">active 7d</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="active30">0</div>
                        <div class="l">active 30d</div>
                    </div>
                    <div class="stat">
                        <div class="n" data-stat="days">0</div>
                        <div class="l">days of data</div>
                    </div>
                </div>
            </section>

            <div class="stack">
                <section class="card">
                    <h2>Hour of day <span class="sub">— each user's local time</span></h2>
                    <div id="hourlychart"></div>
                </section>
                <!--include:by-consonant-card.html-->
            </div>

            <div class="rstack">
                <!--include:per-sound-card.html noun="difficulty"-->
            </div>

            <section class="card span2">
                <h2>Confusion matrix</h2>
                <div class="vccontrols">
                    <div class="vcgroup">
                        <span class="vcgroup-label">data shown</span>
                        <span class="modeswitch" data-switch="metric" id="confmetric">
                            <label><input type="radio" name="confmetric" value="answered" checked />answered</label>
                            <label><input type="radio" name="confmetric" value="guessed" />guessed</label>
                            <label><input type="radio" name="confmetric" value="slow" />slow</label>
                            <label><input type="radio" name="confmetric" value="relistened" />re-listened</label>
                            <label><input type="radio" name="confmetric" value="afterplayed" />after-played</label>
                        </span>
                        <span class="modeswitch" data-switch="mode" id="confmode">
                            <label><input type="radio" name="confmode" value="count" checked />counts</label>
                            <label><input type="radio" name="confmode" value="pct" />% offered</label>
                        </span>
                    </div>
                    <div class="vcgroup">
                        <span class="vcgroup-label">user filters</span>
                        <span class="modeswitch" data-switch="pop" id="confpop" title="which population's confusions to show — gates both this matrix and the sound-file one">
                            <label><input type="radio" name="confpop" value="all" />all</label>
                            <label><input type="radio" name="confpop" value="0" checked />normal users</label>
                            <label><input type="radio" name="confpop" value="2" />natives</label>
                            <label><input type="radio" name="confpop" value="me" />just me</label>
                        </span>
                        <label class="vcfield">min user accuracy <input id="confminacc" type="number" min="0" max="100" value="0" inputmode="numeric" title="exclude users whose overall correct rate is below this % from every confusion matrix — this one and the sound-file matrix below">%</label>
                    </div>
                </div>
                <div id="confchart">
                    <!--include:confusion-vowel-tables.html-->
                </div>
                <div id="conschart">
                    <!--include:confusion-consonant-table.html-->
                </div>
            </section>

            <section class="card span2">
                <h2>Sound-file confusion matrix <span class="sub">— per recording, grouped by sound</span></h2>
                <!--include:voice-confusion-body.html vcmin="3" vcwrong="15" userfilters="<div class='vcgroup'><span class='vcgroup-label'>user filters</span><span class='modeswitch' data-switch='pop' id='confpop2'><label><input type='radio' name='confpop2' value='all'>all</label><label><input type='radio' name='confpop2' value='0' checked>normal users</label><label><input type='radio' name='confpop2' value='2'>natives</label><label><input type='radio' name='confpop2' value='me'>just me</label></span><label class='vcfield'>min user accuracy <input id='confminacc2' type='number' min='0' max='100' value='0' inputmode='numeric'>%</label></div>"-->
            </section>
        </main>

        <script src="stats.js"></script>
    </body>
</html>
