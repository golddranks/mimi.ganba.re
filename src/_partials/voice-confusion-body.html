<!-- Sound-file confusion matrix body (filters + grid container), shared by admin
     (all-users) and the dashboard (per-user). Default filter thresholds differ —
     one user has far fewer attempts than the aggregate — so they're {{vcmin}} /
     {{vcwrong}} args. drawVoiceConfusion (shared/voiceconf.js) fills #voiceconf. -->
<div class="voicefilter">
    min attempts:
    <input id="vcmin" type="number" min="0" value="{{vcmin}}" inputmode="numeric">
    <span id="vcwronglabel">min % wrong</span>:
    <input id="vcwrong" type="number" min="0" value="{{vcwrong}}" inputmode="numeric" title="row's strongest cell must hit at least this percentage of the row's attempts — independent of the counts/per-sound-% display toggle">
    {{minacc}}
    {{pop}}
</div>
<div id="voiceconf"></div>
