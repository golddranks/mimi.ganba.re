<!-- Per-sound accuracy card, shared by the dashboard ("accuracy") and admin
     ("difficulty") — the only difference is the heading noun, passed as {{noun}}.
     19 bar rows (katakana = the heard sound); drawBars reorders them
     hardest-first and fills widths/text. -->
<section class="card">
    <h2>Per-sound {{noun}}
        <span class="modeswitch" data-switch="mode" id="moramode">
            <label><input type="radio" name="moramode" value="count" checked>counts</label>
            <label><input type="radio" name="moramode" value="pct">per-sound %</label>
        </span>
        <span class="sub">(hardest first)</span>
    </h2>
    <div id="morachart">
        <div class="mrow" data-mora="sa"><div class="mname">サ</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="za"><div class="mname">ザ</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
