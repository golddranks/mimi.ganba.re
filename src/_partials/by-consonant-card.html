<!-- By-consonant accuracy card, shared verbatim by the dashboard and admin.
     6 bar rows (s/z/ts/sh/j/ch); drawBars reorders hardest-first and fills
     widths/text from per-mora counts summed by consonant. Follows the global
     count/% toggle (no switch of its own). -->
<section class="card">
    <h2>By consonant <span class="sub">(hardest first · s / z / ts / sh / j / ch)</span></h2>
    <div id="consmorachart">
        <div class="mrow" data-mora="s"><div class="mname">s</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="z"><div class="mname">z</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="ts"><div class="mname">ts</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="sh"><div class="mname">sh</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="j"><div class="mname">j</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
        <div class="mrow" data-mora="ch"><div class="mname">ch</div><div class="mbar"><div class="mbar-total"><div class="mbar-correct"></div></div></div><div class="mtxt">0/0</div></div>
    </div>
</section>
