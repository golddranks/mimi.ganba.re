<!-- The by-consonant confusion table (#conschart body), shared by the dashboard
     and admin. Same data as the per-vowel tables, collapsed to the six consonant
     classes (aggregateByConsonant). rows = consonant heard, columns = picked. -->
<div class="confgroup">
    <h3>By consonant</h3>
    <table class="confgrid">
        <thead>
            <tr><th></th><th>s</th><th>z</th><th>ts</th><th>sh</th><th>j</th><th>ch</th></tr>
        </thead>
        <tbody>
            <tr><th>s</th><td data-t="s" data-p="s" class="diag"></td><td data-t="s" data-p="z"></td><td data-t="s" data-p="ts"></td><td data-t="s" data-p="sh"></td><td data-t="s" data-p="j"></td><td data-t="s" data-p="ch"></td></tr>
            <tr><th>z</th><td data-t="z" data-p="s"></td><td data-t="z" data-p="z" class="diag"></td><td data-t="z" data-p="ts"></td><td data-t="z" data-p="sh"></td><td data-t="z" data-p="j"></td><td data-t="z" data-p="ch"></td></tr>
            <tr><th>ts</th><td data-t="ts" data-p="s"></td><td data-t="ts" data-p="z"></td><td data-t="ts" data-p="ts" class="diag"></td><td data-t="ts" data-p="sh"></td><td data-t="ts" data-p="j"></td><td data-t="ts" data-p="ch"></td></tr>
            <tr><th>sh</th><td data-t="sh" data-p="s"></td><td data-t="sh" data-p="z"></td><td data-t="sh" data-p="ts"></td><td data-t="sh" data-p="sh" class="diag"></td><td data-t="sh" data-p="j"></td><td data-t="sh" data-p="ch"></td></tr>
            <tr><th>j</th><td data-t="j" data-p="s"></td><td data-t="j" data-p="z"></td><td data-t="j" data-p="ts"></td><td data-t="j" data-p="sh"></td><td data-t="j" data-p="j" class="diag"></td><td data-t="j" data-p="ch"></td></tr>
            <tr><th>ch</th><td data-t="ch" data-p="s"></td><td data-t="ch" data-p="z"></td><td data-t="ch" data-p="ts"></td><td data-t="ch" data-p="sh"></td><td data-t="ch" data-p="j"></td><td data-t="ch" data-p="ch" class="diag"></td></tr>
        </tbody>
    </table>
    <div class="legend">rows = consonant heard · columns = consonant picked</div>
</div>
