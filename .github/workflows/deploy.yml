name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'data/phonetic_training/morae/good/**'
      - 'scripts/**'
      - 'shell.nix'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pages:  ${{ steps.filter.outputs.pages }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            pages:
              - 'src/**'
              - 'data/phonetic_training/morae/good/**'
              - 'scripts/voicemap.py'
              - 'scripts/transcode_audio.py'
              - 'scripts/build.py'
              - 'shell.nix'
              - '.github/workflows/deploy.yml'
            worker:
              - 'worker/**'
              - 'src/shared/**'               # bundled into the worker via import (skill, vapid, daytier, dates, …)
              - 'data/phonetic_training/morae/good/**'
              - 'scripts/voicemap.py'
              - '.github/workflows/deploy.yml'

  transcode:
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        id: opus
        with:
          path: dist/audio
          key: opus-${{ hashFiles('data/phonetic_training/morae/good/**') }}

      # Fast path: cache hit → setup-python is enough (voicemap.py only, no ffmpeg).
      - if: steps.opus.outputs.cache-hit == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14.0'
      - if: steps.opus.outputs.cache-hit == 'true'
        run: python scripts/voicemap.py

      # Slow path: cache miss → nix only, no setup-python.
      # Mixing the two leaks LD_LIBRARY_PATH from setup-python's libpython into
      # nix-shell, which then segfaults nix's python on startup. Keeping them
      # mutually exclusive in this job avoids that.
      - if: steps.opus.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/64c08a7ca051951c8eae34e3e3cb1e202fe36786.tar.gz
      - if: steps.opus.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d  # v14
        with:
          use-flakehub: false
      - if: steps.opus.outputs.cache-hit != 'true'
        run: nix-shell --run "python scripts/voicemap.py && python scripts/transcode_audio.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audio
          path: dist/audio
          if-no-files-found: error

  bundle:
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14.0'
      - run: python scripts/voicemap.py
      # build.py minifies via esbuild (standalone binary, no node_modules).
      # Pinned; the dl script drops ./esbuild in the repo root where build.py
      # looks for it. Keep this version in sync with scripts/build.py + dev.sh.
      - run: curl -fsSL https://esbuild.github.io/dl/v0.28.0 | sh
      - run: python scripts/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html
          path: dist
          # `path: dist` uploads the CONTENTS of dist/ (not a "dist/" prefix in
          # the archive). deploy-pages's download therefore uses `path: dist`
          # to put them back. include-hidden-files preserves .nojekyll.
          if-no-files-found: error
          include-hidden-files: true

  # Full-stack pre-deploy gate, shared by BOTH deploys: pull a fresh prod snapshot
  # into a local miniflare D1, build the site, and run the e2e suite (migration
  # gate + happy-dom DOM tests) against it. Runs whenever either side changed, so
  # a frontend-only change is gated too — the DOM tests drive the very pages that
  # deploy-pages publishes. Needs CLOUDFLARE_API_TOKEN with D1 (see worker/README).
  e2e:
    needs: changes
    if: needs.changes.outputs.pages == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: worker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22.22.3'
      - run: npm ci
        working-directory: worker
      # e2e.sh runs build.py, which minifies via esbuild — fetch the pinned
      # binary into the repo root. Keep in sync with scripts/build.py + dev.sh.
      - run: curl -fsSL https://esbuild.github.io/dl/v0.28.0 | sh
      - name: e2e (snapshot prod, build, full suite)
        run: ./scripts/e2e.sh --snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    needs: [changes, transcode, bundle, e2e]
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: html
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: audio
          path: dist/audio
      - run: echo "mimi.ganba.re" > dist/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  deploy-worker:
    needs: [changes, e2e]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: worker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14.0'
      - run: python scripts/voicemap.py        # the worker bundle imports src/voicemap.js
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: '4.93.0'

  # Post-deploy verification of the LIVE system: runs after both deploys settle
  # and drives the *deployed* dashboard (fetched from Pages) against the *live*
  # worker — see scripts/verify.sh. Writes only under the TestUser sentinel, so
  # no token/secret is needed. Skipped only if a deploy failed; runs whether the
  # change was pages, worker, or both.
  verify:
    needs: [deploy-pages, deploy-worker]
    if: >-
      always()
      && needs.deploy-pages.result != 'failure'
      && needs.deploy-worker.result != 'failure'
      && (needs.deploy-pages.result == 'success' || needs.deploy-worker.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22.22.3'
      - run: npm ci                            # happy-dom for the deployed DOM check
        working-directory: worker
      - run: ./scripts/verify.sh               # defaults to the production URLs
